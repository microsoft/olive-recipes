keywords:
    aitk
arch: phi3
recipes:
    - file: "phi3_5_qnn_config.json"
      device: npu
      ep: QNNExecutionProvider
      aitk:
        oliveFile: "QNN/x_elite_config.json"
    - file: "phi3_5_vitis_ai_config.json"
      device: npu
      ep: VitisAIExecutionProvider
      aitk:
        oliveFile: "VitisAI/Phi-3.5-mini-instruct_quark_vitisai_llm.json"
        requirements: AMD/Quark_py3.10.17
        evalRuntime: AMDNPU
    - file: "phi3_5_ov_gpu_config.json"
      devices:
        - gpu
        - cpu
      ep: OpenVINOExecutionProvider
    - file: "phi3_5_ov_config.json"
      devices:
        - npu
      ep: OpenVINOExecutionProvider
    - file: "phi3_5_trtrtx_config.json"
      device: gpu
      ep: NvTensorRTRTXExecutionProvider
      aitk:
        oliveFile: "NvTensorRtRtx/Phi-3.5-mini-instruct_model_builder_int4.json"
    - file: "phi3_5_dml_config.json"
      device: gpu
      ep: DmlExecutionProvider
    - file: "phi3_5_qnn_gpu_config.json"
      device: gpu
      ep: QNNExecutionProvider
      aitk:
        oliveFile: "QNN/config_gpu.json"
        isGPURequired: true
        requirements: General/CUDA_py3.12.9
        executePatchPy: phi3_5_qnn_gpu_config.py
        executeRuntimeFeatures:
          - AutoGptq
          - olive
    - file: "phi3_5_webgpu.json"
      device: gpu
      ep: WebGpuExecutionProvider
      aitk:
        requirements: WebGPU/WebGPU_py3.12.13
        evalRuntime: WebGPU
        oliveFile:
          phi3_5_webgpu.json:
            ref: "../Qwen-Qwen3-4B/webgpu/Qwen-Qwen3-4B_webgpu_int4.json"
            ignoreChanged:
              - ^root\['s'\]$
aitk:
    modelInfo:
        id: "huggingface/microsoft/Phi-3.5-mini-instruct"
        version: 11
        p0: true
