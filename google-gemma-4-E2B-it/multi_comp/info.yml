keywords:
  - gemma4
  - multimodal
  - multi-component
  - qnn
  - npu
  - openvino
arch: gemma
recipes:
  - name: gemma4
    file: gemma4_quantize.json
    eps:
      - CPUExecutionProvider
    devices:
      - cpu
  - name: gemma4-qnn-decoder
    file: qnn_decoder.json
    eps:
      - QNNExecutionProvider
    devices:
      - npu
  - name: gemma4-qnn-vision
    file: qnn_vision.json
    eps:
      - CUDAExecutionProvider
      - QNNExecutionProvider
    devices:
      - gpu
      - npu
  - name: gemma4-ov
    file: ov.json
    eps:
      - OpenVINOExecutionProvider
    devices:
      - npu
